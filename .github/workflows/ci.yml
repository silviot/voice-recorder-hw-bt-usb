name: Cassini OpenFW CI

on:
  # Branch pushes are covered by pull_request; only main runs on push,
  # so a commit on a PR branch no longer runs twice.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.zip'
      - '*.rules'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.zip'
      - '*.rules'
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm exfatprogs python3 python3-pil meson ninja-build python3-numpy

      - name: Fetch LVGL sources
        run: make -C open_fw fetch-lvgl

      - name: Cache picolibc for BT=1 ARM builds
        uses: actions/cache@v4
        with:
          path: /tmp/sl6801_picolibc/pl-install
          key: picolibc-${{ runner.os }}-${{ hashFiles('open_fw/tools/build_picolibc.sh') }}

      - name: Run OpenFW host unit and MMIO driver tests
        run: make -C open_fw test-host

      - name: Run OpenFW host tests under ASan + UBSan
        run: make -C open_fw test-host-san

      # The default image's Bluetooth layer (BT=1) on the host: entropy/DRBG/store/probe-trigger shims, the
      # controller shim against the fake ROM, the phone-mode XREC session over mocked Bluedroid SPP, and the
      # headphones SBC/resampler/audio-out suite. test-bt-host (full Bluedroid harness) stays local.
      - name: Run OpenFW Bluetooth host tests (BT=1 port, controller shim, XREC session, headphones DSP)
        run: make -C open_fw test-bt-port test-bt-ctrl test-bt-xrec test-bt-hp

      - name: Build Cassini OpenFW ARM firmware (BT=0, BT=1, BT=1 BENCH=1) and WASM emulator
        run: |
          make -C open_fw BT=0 BUILD_DIR=/tmp/sl6801_openfw_bt0 OUT_BIN=/tmp/sl6801_openfw_bt0/fw.bin all
          make -C open_fw BT=1 all
          make -C open_fw BT=1 BENCH=1 BUILD_DIR=/tmp/sl6801_openfw_bench OUT_BIN=/tmp/sl6801_openfw_bench/fw.bin all
          make -C open_fw wasm

      - name: Run Python host tool self-tests and safety regressions
        run: |
          python3 tools/flash_ranges.py --self-test
          python3 tools/openfw_usb.py --self-test
          python3 tools/usb_rtc_sync.py --dry-run
          python3 tools/dev_cycle.py --self-test
          python3 tools/asr_prep.py --self-test
          python3 tools/cassini_to_device.py --self-test
          python3 tools/bt_probe_report.py --self-test
          python3 tools/bt_entropy_unpack.py --self-test
          python3 tools/rf_audio_check.py --self-test
          python3 tools/test_tools.py
