name: Cassini OpenFW CI

on:
  # Branch pushes are covered by pull_request; only main runs on push,
  # so a commit on a PR branch no longer runs twice.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.zip'
      - '*.rules'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.zip'
      - '*.rules'
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm exfatprogs python3 python3-pil

      - name: Fetch LVGL sources
        run: make -C open_fw fetch-lvgl

      - name: Run OpenFW host unit and MMIO driver tests
        run: make -C open_fw test-host

      - name: Run OpenFW host tests under ASan + UBSan
        run: make -C open_fw test-host-san

      # The default image's Bluetooth layer (BT=1) on the host: entropy/DRBG/store/probe-trigger shims, the
      # controller shim against the fake ROM, and the phone-mode XREC session over mocked Bluedroid SPP. Host
      # compiler + vendored Bluedroid headers only (no picolibc). test-bt-host (full Bluedroid harness) stays local.
      - name: Run OpenFW Bluetooth host tests (BT=1 port, controller shim, XREC session)
        run: make -C open_fw test-bt-port test-bt-ctrl test-bt-xrec

      # BT=0 (no Bluetooth): the default BT=1 image needs picolibc (tools/build_picolibc.sh: meson + ninja), which
      # this runner does not install. The BT=1 ARM build runs in the local gates.
      - name: Build Cassini OpenFW ARM firmware (BT=0)
        run: make -C open_fw BT=0 all

      - name: Run Python host tool self-tests and safety regressions
        run: |
          python3 tools/flash_ranges.py --self-test
          python3 tools/openfw_usb.py --self-test
          python3 tools/usb_rtc_sync.py --dry-run
          python3 tools/dev_cycle.py --self-test
          python3 tools/asr_prep.py --self-test
          python3 tools/cassini_to_device.py --self-test
          python3 tools/test_tools.py
